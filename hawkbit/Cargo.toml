[package]
name = "hawkbit"
version = "0.7.2"
authors = ["Thomas Witte <thomas.witte@liebherr.com>", "Guillaume Desmottes <guillaume.desmottes@collabora.com>"]
edition = "2018"
categories = ["api-bindings"]
description = "Client side API to interact with Eclipse hawkBit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/liebherr-group/hawkbit-rs"
documentation = "https://docs.rs/hawkbit_mock/"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1.1", features = ["time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.2"
strum = { version = "0.27", features = ["derive"] }
cfg-if = "1.0"
digest = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
sha-1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
futures = "0.3"
bytes = "1.0"

[dev-dependencies]
hawkbit_mock = { path = "../hawkbit_mock/" }
structopt = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tempdir = "0.3"
assert_matches = "1.4"
httpmock = "0.8.0"

[features]
hash-digest= ["digest"]
hash-md5 = ["md-5", "hash-digest"]
hash-sha1 = ["sha-1", "hash-digest"]
hash-sha256 = ["sha2", "hash-digest"]
